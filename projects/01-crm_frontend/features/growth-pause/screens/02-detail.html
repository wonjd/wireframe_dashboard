<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 상세</title>
<style>
*,*::before,*::after{box-sizing:border-box}body{margin:0;font:13px/1.5 ui-sans-serif,"Malgun Gothic",sans-serif;color:#404040}
.wf-shell{display:flex;min-height:100vh}.wf-sidebar{width:190px;padding:12px;border-right:1px solid #e5e5e5;background:#fafafa}
.wf-sidebar button{display:block;width:100%;padding:7px 10px;margin-bottom:2px;border:0;border-radius:4px;background:none;text-align:left}
.wf-body{flex:1;padding:16px;display:grid;gap:12px}
.wf-card{padding:14px;border:1px solid #e5e5e5;border-radius:6px}
.wf-card-title{font-weight:500;margin-bottom:10px}
.wf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wf-label{font-size:11px;color:#737373;margin-bottom:4px}
.wf-btn{padding:6px 12px;border:1px solid #d4d4d4;border-radius:5px;background:#fff}
.wf-btn.wf-primary{background:#404040;color:#fff;border-color:#404040}
</style>
</head>
<body>
<div class="wf-shell">
  <nav class="wf-sidebar">
    <button>← 목록</button>
  </nav>
  <div class="wf-body">
    <h1>브랜드A — 일시정지 상세</h1>
    <div class="wf-card">
      <div class="wf-card-title">계정 정보 (MODIFY: growthColumns)</div>
      <div class="wf-row">
        <div><div class="wf-label">계정 ID</div><div>ACC-1024</div></div>
        <div><div class="wf-label">상태</div><div>일시정지</div></div>
        <div><div class="wf-label">일시정지 시작</div><div>2026-08-20</div></div>
        <div><div class="wf-label">연장 가능 종료</div><div>2026-09-20</div></div>
      </div>
    </div>
    <div class="wf-card">
      <div class="wf-card-title">연장 이력</div>
      <p>2026-07-01 1차 연장 완료</p>
    </div>
    <div>
      <button class="wf-btn">목록</button>
      <button class="wf-btn">연장 모달 열기</button>
    </div>
  </div>
</div>
</body>
</html>
