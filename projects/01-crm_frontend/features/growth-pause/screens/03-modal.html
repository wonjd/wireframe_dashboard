<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 연장 모달</title>
<style>
body{margin:0;font:13px/1.5 ui-sans-serif,"Malgun Gothic",sans-serif;color:#404040;background:rgba(23,23,23,.35);min-height:100vh;display:flex;align-items:center;justify-content:center}
[data-modal]{width:100%;max-width:420px;background:#fff;border:1px solid #d4d4d4;border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.18)}
.wf-modal-head{display:flex;padding:11px 14px;border-bottom:1px solid #e5e5e5}
.wf-modal-body{padding:14px;display:grid;gap:12px}
.wf-modal-foot{display:flex;justify-content:flex-end;gap:6px;padding:11px 14px;border-top:1px solid #e5e5e5}
.wf-label{font-size:11px;color:#737373;margin-bottom:4px}
input,select{width:100%;padding:6px 9px;border:1px solid #d4d4d4;border-radius:5px}
.wf-btn{padding:6px 12px;border:1px solid #d4d4d4;border-radius:5px;background:#fff}
.wf-btn.wf-primary{background:#404040;color:#fff;border-color:#404040}
</style>
</head>
<body>
<div data-modal>
  <div class="wf-modal-head"><h3>연장 처리</h3></div>
  <div class="wf-modal-body">
    <div><div class="wf-label">연장 기간</div><select><option>30일</option><option>60일</option></select></div>
    <div><div class="wf-label">사유</div><input placeholder="연장 사유 입력" /></div>
  </div>
  <div class="wf-modal-foot">
    <button class="wf-btn">취소</button>
    <button class="wf-btn">연장 확정</button>
  </div>
</div>
</body>
</html>
