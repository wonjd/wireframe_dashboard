<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 목록</title>
<style>
*,*::before,*::after{box-sizing:border-box}body{margin:0;font:13px/1.5 ui-sans-serif,"Malgun Gothic",sans-serif;color:#404040}
.wf-shell{display:flex;min-height:100vh}.wf-sidebar{width:190px;padding:12px;border-right:1px solid #e5e5e5;background:#fafafa}
.wf-sidebar-title{font-size:11px;color:#737373;text-transform:uppercase;margin-bottom:8px}
.wf-sidebar button{display:block;width:100%;padding:7px 10px;margin-bottom:2px;border:0;border-radius:4px;background:#e5e5e5;text-align:left}
.wf-body{flex:1;padding:16px;display:grid;gap:12px}
.wf-header{display:flex;border-bottom:1px solid #e5e5e5;padding-bottom:12px}.wf-actions{margin-left:auto}
.wf-btn{padding:6px 12px;border:1px solid #d4d4d4;border-radius:5px;background:#404040;color:#fff}
.wf-stats{display:flex;gap:12px}.wf-stat{flex:1;padding:12px;border:1px solid #e5e5e5;border-radius:6px}
.wf-stat b{display:block;font-size:19px;color:#262626}
table{width:100%;border-collapse:collapse;border:1px solid #e5e5e5}th,td{padding:8px 10px;border-top:1px solid #f0f0f0}
thead{background:#fafafa}.wf-badge{padding:1px 7px;border:1px solid #e5e5e5;border-radius:999px;font-size:11px}
.wf-muted{color:#a3a3a3;font-size:12px}
</style>
</head>
<body>
<div class="wf-shell">
  <nav class="wf-sidebar">
    <div class="wf-sidebar-title">성장 관리</div>
    <button>일시정지 연장 현황</button>
    <button>성장 계정 목록</button>
  </nav>
  <div class="wf-body">
    <div class="wf-header">
      <div><h1>일시정지 연장 현황</h1><p class="wf-muted">성장 계정의 일시정지·연장 요청을 조회합니다.</p></div>
      <div class="wf-actions"><button class="wf-btn">연장 처리</button></div>
    </div>
    <div class="wf-stats">
      <div class="wf-stat">요청 대기<b>8</b></div>
      <div class="wf-stat">연장 완료<b>24</b></div>
      <div class="wf-stat">만료 임박<b>3</b></div>
    </div>
    <table>
      <thead><tr><th>계정</th><th>상태</th><th>일시정지일</th><th>연장 가능일</th><th>담당</th></tr></thead>
      <tbody>
        <tr><td>브랜드A</td><td><span class="wf-badge">요청</span></td><td>2026-08-20</td><td>2026-09-20</td><td>김운영</td></tr>
        <tr><td>브랜드B</td><td><span class="wf-badge">연장완료</span></td><td>2026-08-10</td><td>2026-10-10</td><td>이기획</td></tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
